name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', laravel: '10', laravel_constraint: '^10.50.3', testbench: '^8.0', dependencies: prefer-stable }
          - { php: '8.2', laravel: '10', laravel_constraint: '^10.50.3', testbench: '^8.0', dependencies: prefer-stable }
          - { php: '8.3', laravel: '10', laravel_constraint: '^10.50.3', testbench: '^8.0', dependencies: prefer-stable }
          - { php: '8.4', laravel: '10', laravel_constraint: '^10.50.3', testbench: '^8.0', dependencies: prefer-stable }
          - { php: '8.2', laravel: '11', laravel_constraint: '^11.0', testbench: '^9.0', dependencies: prefer-stable }
          - { php: '8.3', laravel: '11', laravel_constraint: '^11.0', testbench: '^9.0', dependencies: prefer-stable }
          - { php: '8.4', laravel: '11', laravel_constraint: '^11.0', testbench: '^9.0', dependencies: prefer-stable }
          - { php: '8.2', laravel: '12', laravel_constraint: '^12.0', testbench: '^10.0', dependencies: prefer-stable }
          - { php: '8.3', laravel: '12', laravel_constraint: '^12.0', testbench: '^10.0', dependencies: prefer-stable }
          - { php: '8.4', laravel: '12', laravel_constraint: '^12.0', testbench: '^10.0', dependencies: prefer-stable }
          - { php: '8.3', laravel: '13', laravel_constraint: '^13.0', testbench: '^11.0', dependencies: prefer-stable }
          - { php: '8.4', laravel: '13', laravel_constraint: '^13.0', testbench: '^11.0', dependencies: prefer-stable }
          - { php: '8.1', laravel: '10', laravel_constraint: '^10.50.3', testbench: '^8.0', dependencies: prefer-lowest }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Select Laravel and Testbench versions
        run: |
          composer require "illuminate/support:${{ matrix.laravel_constraint }}" --no-interaction --no-update
          composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update

      - name: Install dependencies
        run: |
          composer config audit.block-insecure false
          composer update --${{ matrix.dependencies }} --prefer-dist --no-interaction --with-all-dependencies

      - name: Run tests
        run: vendor/bin/phpunit
